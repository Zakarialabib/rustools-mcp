name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Release Binary
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-amd64

    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
      
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      
      - name: Build Release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename Binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mv target/${{ matrix.target }}/release/rustools-mcp target/${{ matrix.target }}/release/rustools-mcp-${{ matrix.name }}

      - name: Rename Binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mv target/${{ matrix.target }}/release/rustools-mcp.exe target/${{ matrix.target }}/release/rustools-mcp-${{ matrix.name }}.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustools-mcp-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/rustools-mcp-${{ matrix.name }}
            target/${{ matrix.target }}/release/rustools-mcp-${{ matrix.name }}.exe
          if-no-files-found: error

  create-release:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
          generate_release_notes: true
