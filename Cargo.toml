[package]
name = "rustools-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP implementation for querying Rust API documentation from docs.rs"
authors = ["Zakaria Labib"]
license = "MIT"
repository = "https://github.com/zakarialabib/rustools-mcp"
readme = "README.md"
keywords = ["mcp", "documentation", "docs-rs"]
categories = ["development-tools", "development-tools::documentation"]
default-run = "rustools-mcp"

[dependencies]
rmcp = { version = "0.14.0", features = ["schemars", "server-side-http", "transport-io", "server", "transport-streamable-http-server"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "std",
    "fmt",
] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44.2", features = ["full"] }
thiserror = "2.0.12"
url = "2.3"
anyhow = "1.0.97"
clap = { version = "4.5", features = ["derive"] }
scraper = "0.23.1"
async-trait = "0.1.88"
itertools = "0.14.0"
html2md = "0.2.15"
urlencoding = "2.1.3"
axum = "0.8.8"
tower-http = { version = "0.6.8", features = ["fs", "cors"] }
chrono = "0.4.43"
once_cell = "1.19"
strsim = "0.11.1"
schemars = "1.2.1"
reqwest-middleware = "0.5.0"
reqwest-retry = "0.9.0"
moka = { version = "0.12.13", features = ["future"] }
toml = "0.9.11"
syn = { version = "2.0.114", features = ["full"] }
walkdir = "2.5.0"
ignore = "0.4.25"


[dev-dependencies]
mockito = "1.2.0"
assert_json = "0.1"
tokio = { version = "1.44.1", features = ["full", "tracing"] }
console-subscriber = "0.4.1"
tracing-subscriber = "0.3.19"
tempfile = "3.19.1"

[[example]]
name = "client"
path = "examples/client.rs"

[profile.release]
opt-level = 3
lto = true
