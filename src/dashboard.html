<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rust Tools MCP Dashboard</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-color: #e0e0e0;
            --accent-color: #ff3e00; /* Rust orange */
            --secondary-color: #007acc;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 1000px;
            width: 100%;
        }
        h1 {
            color: var(--accent-color);
            text-align: center;
            margin-bottom: 30px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card h2 {
            margin-top: 0;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #333;
        }
        th {
            color: var(--secondary-color);
        }
        code {
            background-color: #2d2d2d;
            padding: 2px 4px;
            border-radius: 4px;
            font-family: "Fira Code", monospace;
            color: #ffcc00;
        }
        .status-ok { color: #4caf50; }
        .status-err { color: #f44336; }
        
        #logs-container {
            max-height: 400px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 14px;
        }
        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid #2a2a2a;
        }
        .log-time { color: #888; margin-right: 10px; }
        .log-tool { color: var(--accent-color); font-weight: bold; margin-right: 10px; }
        .log-msg { color: #ddd; }
        
        button {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🦀 Rust Tools MCP Dashboard</h1>

        <div class="card">
            <h2>📊 Server Status</h2>
            <p><strong>Status:</strong> <span class="status-ok">● Online</span></p>
            <p><strong>Address:</strong> <span id="server-addr">Loading...</span></p>
            <p><strong>Uptime:</strong> <span id="uptime">Loading...</span></p>
        </div>

        <div class="card">
            <h2>💾 Cache Storage</h2>
            <button onclick="refreshCache()">Refresh Cache List</button>
            <div id="cache-list" style="margin-top: 15px;">Loading...</div>
        </div>

        <div class="card">
            <h2>📜 Recent Activity Logs</h2>
            <button onclick="refreshLogs()">Refresh Logs</button>
            <div id="logs-container" style="margin-top: 15px;">Loading...</div>
        </div>
    </div>

    <script>
        // Simple mock data for now, would fetch from API in real impl
        document.getElementById('server-addr').textContent = window.location.host;
        document.getElementById('uptime').textContent = "Running";

        async function refreshLogs() {
            const container = document.getElementById('logs-container');
            container.innerHTML = "Fetching...";
            try {
                const res = await fetch('/api/logs');
                const logs = await res.json();
                
                if (logs.length === 0) {
                    container.innerHTML = "No logs found.";
                    return;
                }

                container.innerHTML = logs.map(log => `
                    <div class="log-entry">
                        <span class="log-time">[${new Date(log.timestamp).toLocaleTimeString()}]</span>
                        <span class="log-tool">${log.tool || 'system'}</span>
                        <span class="log-msg">${log.message || JSON.stringify(log)}</span>
                    </div>
                `).join('');
            } catch (e) {
                container.innerHTML = `<span class="status-err">Error fetching logs: ${e.message}</span>`;
            }
        }

        async function refreshCache() {
            const container = document.getElementById('cache-list');
            container.innerHTML = "Fetching...";
            try {
                const res = await fetch('/api/cache');
                const files = await res.json();
                
                if (files.length === 0) {
                    container.innerHTML = "Cache is empty.";
                    return;
                }

                container.innerHTML = `<table>
                    <thead><tr><th>File Name</th><th>Action</th></tr></thead>
                    <tbody>
                        ${files.map(f => `
                            <tr>
                                <td>${f}</td>
                                <td><a href="/api/cache/${f}" target="_blank">View Content</a></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>`;
            } catch (e) {
                container.innerHTML = `<span class="status-err">Error fetching cache: ${e.message}</span>`;
            }
        }

        // Initial Load
        refreshLogs();
        refreshCache();
    </script>
</body>
</html>
