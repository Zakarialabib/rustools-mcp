<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP RustDoc Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #e2e8f0;
            --card-bg: #1e293b;
            --border-color: #334155;
            --accent: #38bdf8;
            --success: #4ade80;
            --error: #f87171;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        h1 { margin: 0; font-size: 1.5rem; }
        .tabs { display: flex; gap: 10px; }
        .tab {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 6px;
        }
        .tab.active {
            background: var(--accent);
            color: #000;
            font-weight: bold;
        }
        .content { display: none; }
        .content.active { display: block; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        th { background: #0f172a; }
        tr:hover { background: #334155; cursor: pointer; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }
        .modal.open { display: flex; }
        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-height: 80%;
            overflow: auto;
            position: relative;
        }
        .close {
            position: absolute;
            top: 10px; right: 10px;
            cursor: pointer;
            font-size: 1.5rem;
        }
        pre {
            background: #000;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            white-space: pre-wrap;
        }
        .badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            background: #475569;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>MCP RustDoc Dashboard</h1>
            <div class="tabs">
                <button class="tab active" onclick="showTab('logs')">Live Logs</button>
                <button class="tab" onclick="showTab('cache')">Cache Explorer</button>
            </div>
        </header>

        <div id="logs" class="content active">
            <div style="margin-bottom: 10px; display: flex; justify-content: space-between;">
                <span>Auto-refreshing every 2s...</span>
                <button onclick="fetchLogs()" style="padding: 4px 12px; cursor: pointer;">Refresh Now</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Tool</th>
                        <th>Args Summary</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="logs-body"></tbody>
            </table>
        </div>

        <div id="cache" class="content">
            <div style="display: flex; gap: 20px;">
                <div style="width: 30%;">
                    <h3>Crates</h3>
                    <ul id="cache-list" style="list-style: none; padding: 0;"></ul>
                </div>
                <div style="width: 70%;">
                    <h3>Content</h3>
                    <pre id="cache-content">Select a crate to view cache...</pre>
                </div>
            </div>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>Log Details</h2>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        function showTab(id) {
            document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelector(`.tab[onclick="showTab('${id}')"]`).classList.add('active');
            if (id === 'cache') fetchCacheList();
        }

        async function fetchLogs() {
            try {
                const res = await fetch('/api/logs');
                const logs = await res.json();
                const tbody = document.getElementById('logs-body');
                tbody.innerHTML = logs.reverse().map((log, index) => {
                    const argsSummary = JSON.stringify(log.args).substring(0, 50) + (JSON.stringify(log.args).length > 50 ? '...' : '');
                    const isError = log.result && log.result.Err;
                    return `
                        <tr onclick="openLog(${index})">
                            <td>${new Date(log.timestamp).toLocaleTimeString()}</td>
                            <td><span class="badge">${log.tool}</span></td>
                            <td>${argsSummary}</td>
                            <td><span style="color: ${isError ? 'var(--error)' : 'var(--success)'}">${isError ? 'Error' : 'Success'}</span></td>
                        </tr>
                    `;
                }).join('');
                window.logsData = logs;
            } catch (e) { console.error(e); }
        }

        function openLog(index) {
            const log = window.logsData[index];
            const content = `
                <h3>Arguments</h3>
                <pre>${JSON.stringify(log.args, null, 2)}</pre>
                <h3>Result</h3>
                <pre>${JSON.stringify(log.result, null, 2)}</pre>
            `;
            document.getElementById('modal-body').innerHTML = content;
            document.getElementById('modal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('open');
        }

        async function fetchCacheList() {
            const res = await fetch('/api/cache');
            const files = await res.json();
            const list = document.getElementById('cache-list');
            list.innerHTML = files.map(f => 
                `<li><button onclick="fetchCacheItem('${f}')" style="width:100%; text-align:left; padding:8px; background:var(--card-bg); border:1px solid var(--border-color); color:var(--text-color); margin-bottom:4px; cursor:pointer;">${f}</button></li>`
            ).join('');
        }

        async function fetchCacheItem(name) {
            const res = await fetch(`/api/cache/${name}`);
            const data = await res.json();
            document.getElementById('cache-content').textContent = JSON.stringify(data, null, 2);
        }

        setInterval(() => {
            if (document.getElementById('logs').classList.contains('active')) {
                fetchLogs();
            }
        }, 2000);

        fetchLogs();
    </script>
</body>
</html>
